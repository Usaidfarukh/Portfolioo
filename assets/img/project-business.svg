<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150f22"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="550" fill="url(#bg1)"/>
  <rect width="800" height="550" fill="url(#glow1)"/>

  <!-- browser chrome -->
  <rect x="40" y="40" width="720" height="470" rx="14" fill="#111111" stroke="#232323"/>
  <circle cx="66" cy="66" r="5" fill="#3a3a3a"/>
  <circle cx="84" cy="66" r="5" fill="#3a3a3a"/>
  <circle cx="102" cy="66" r="5" fill="#3a3a3a"/>
  <rect x="130" y="58" width="500" height="16" rx="8" fill="#1c1c1c"/>

  <!-- nav bar -->
  <rect x="40" y="90" width="720" height="52" fill="#0d0d0d"/>
  <rect x="72" y="108" width="70" height="16" rx="4" fill="url(#accent1)"/>
  <rect x="500" y="112" width="46" height="8" rx="4" fill="#3a3a3a"/>
  <rect x="560" y="112" width="46" height="8" rx="4" fill="#3a3a3a"/>
  <rect x="620" y="108" width="90" height="18" rx="9" fill="none" stroke="#8B5CF6"/>

  <!-- hero content -->
  <rect x="80" y="180" width="300" height="18" rx="4" fill="#e5e5e5"/>
  <rect x="80" y="208" width="380" height="18" rx="4" fill="#e5e5e5" opacity="0.85"/>
  <rect x="80" y="248" width="260" height="10" rx="3" fill="#6b6b6b"/>
  <rect x="80" y="266" width="220" height="10" rx="3" fill="#6b6b6b"/>
  <rect x="80" y="300" width="130" height="34" rx="17" fill="url(#accent1)"/>

  <!-- card row -->
  <g>
    <rect x="80" y="370" width="190" height="110" rx="12" fill="#151515" stroke="#252525"/>
    <rect x="98" y="388" width="34" height="34" rx="8" fill="#8B5CF6" opacity="0.25"/>
    <rect x="98" y="436" width="120" height="9" rx="3" fill="#c9c9c9"/>
    <rect x="98" y="452" width="150" height="7" rx="3" fill="#5c5c5c"/>
  </g>
  <g>
    <rect x="300" y="370" width="190" height="110" rx="12" fill="#151515" stroke="#252525"/>
    <rect x="318" y="388" width="34" height="34" rx="8" fill="#A855F7" opacity="0.25"/>
    <rect x="318" y="436" width="120" height="9" rx="3" fill="#c9c9c9"/>
    <rect x="318" y="452" width="150" height="7" rx="3" fill="#5c5c5c"/>
  </g>
  <g>
    <rect x="520" y="370" width="190" height="110" rx="12" fill="#151515" stroke="#252525"/>
    <rect x="538" y="388" width="34" height="34" rx="8" fill="#8B5CF6" opacity="0.25"/>
    <rect x="538" y="436" width="120" height="9" rx="3" fill="#c9c9c9"/>
    <rect x="538" y="452" width="150" height="7" rx="3" fill="#5c5c5c"/>
