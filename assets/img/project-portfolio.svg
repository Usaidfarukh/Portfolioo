<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120c1c"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow3" cx="20%" cy="90%" r="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="550" fill="url(#bg3)"/>
  <rect width="800" height="550" fill="url(#glow3)"/>

  <rect x="40" y="40" width="720" height="470" rx="14" fill="#0e0e0e" stroke="#232323"/>
  <circle cx="66" cy="66" r="5" fill="#3a3a3a"/>
  <circle cx="84" cy="66" r="5" fill="#3a3a3a"/>
  <circle cx="102" cy="66" r="5" fill="#3a3a3a"/>

  <!-- split layout: text left, gallery right -->
  <rect x="80" y="140" width="230" height="14" rx="4" fill="#8B5CF6" opacity="0.6"/>
  <rect x="80" y="168" width="270" height="30" rx="6" fill="#eee"/>
  <rect x="80" y="204" width="240" height="30" rx="6" fill="#eee" opacity="0.85"/>
  <rect x="80" y="252" width="220" height="9" rx="3" fill="#666"/>
  <rect x="80" y="268" width="180" height="9" rx="3" fill="#666"/>
  <rect x="80" y="300" width="120" height="34" rx="17" fill="url(#accent3)"/>

  <!-- masonry gallery -->
  <rect x="380" y="140" width="150" height="130" rx="10" fill="#181818" stroke="#262626"/>
  <rect x="540" y="140" width="150" height="80" rx="10" fill="#1c1428" stroke="#8B5CF6" opacity="0.6"/>
  <rect x="540" y="230" width="150" height="40" rx="10" fill="#181818" stroke="#262626"/>
  <rect x="380" y="280" width="310" height="70" rx="10" fill="#161020" stroke="#3a2a52"/>

  <!-- footer strip / timeline -->
  <line x1="80" y1="400" x2="720" y2="400" stroke="#262626"/>
  <circle cx="120" cy="400" r="6" fill="url(#accent3)"/>
  <circle cx="300" cy="400" r="6" fill="#3a3a3a"/>
  <circle cx="480" cy="400" r="6" fill="#3a3a3a"/>
  <circle cx="660" cy="400" r="6" fill="#3a3a3a"/>
  <rect x="90" y="420" width="70" height="8" rx="3" fill="#555"/>
  <rect x="270" y="420" width="70" height="8" rx="3" fill="#555"/>
  <rect x="450" y="420" width="70" height="8" rx="3" fill="#555"/>
  <rect x="630" y="420" width="70" height="8" rx="3" fill="#555"/>
</svg>
